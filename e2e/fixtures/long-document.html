<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Long document</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #bands { display: block; }
  </style>
</head>
<body>
  <!-- The page itself scrolls. Band i occupies document y = 8 * i ... 8 * i + 8. -->
  <div id="bands"></div>
  <script type="module">
    import { appendBands, bandCountFromQuery } from './fixture-bands.js';
    const count = bandCountFromQuery(1200);
    const container = document.getElementById('bands');
    if (container) appendBands(container, 0, count);
    document.documentElement.dataset.bands = String(count);
  </script>
</body>
</html>
