name: Bug report
description: Spool did something wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Spool version
      description: Shown at the bottom of Settings and on chrome://extensions.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, version and operating system
      placeholder: Chrome 142 on macOS 26
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The page (a public URL if you can), what you selected, what you pressed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you saw and what you expected
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not attach screenshots that show private data. Describe it instead.
