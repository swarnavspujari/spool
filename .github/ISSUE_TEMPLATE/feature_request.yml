name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What would you change?
      description: Spool has no network access and asks for as few permissions as it can. Say if your idea needs either.
    validations:
      required: true
